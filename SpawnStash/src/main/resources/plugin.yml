name: SpawnStash
version: 2.0.0
main: de.openai.spawnstash.SpawnStashPlugin
api-version: '1.21'
author: OpenAI

commands:
  spawnstash:
    description: Spawnt eine gespeicherte Stash.
    usage: /spawnstash <name>
    permission: spawnstash.use

  stash:
    description: Verwaltet gespeicherte Stashes.
    usage: /stash <wand|save|list|delete|clear|reload>
    permission: spawnstash.edit

permissions:
  spawnstash.use:
    description: Darf gespeicherte Stashes spawnen.
    default: op

  spawnstash.edit:
    description: Darf Stashes auswählen, speichern und bearbeiten.
    default: op

  spawnstash.reload:
    description: Darf SpawnStash neu laden.
    default: op
